import java.util.concurrent.Callable

plugins {
    id 'com.krakenplugins.plugin' version '0.2.0'
}

def runeLiteVersion = '1.13.2' // latest.release
def krakenApiVersion = System.getenv("KRAKEN_API_VERSION") ?: '5.2.2'

subprojects {
    apply plugin: 'com.krakenplugins.plugin'

    group = 'com.krakenplugins'

    repositories {
        mavenLocal {
            content {
                includeGroup "com.github.kraken"
            }
        }
    }

    kraken {
        apiVersion = krakenApiVersion
        runeliteVersion = runeLiteVersion
        lombokVersion = '1.18.30'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(17)
    }
}

kraken {
    sideload.setFrom({ subprojects.collect { it.tasks.named('jar') } } as Callable)

    // ./gradlew krakenRelease checks every plugin against the Kraken API the client runs, then writes the jars and a
    // manifest signed with KRAKEN_SIGNING_KEY to build/kraken-release. CI passes the release version in VERSION.
    release {
        name = 'Kraken Example Plugins'
        version = providers.environmentVariable('VERSION').orElse('0.0.0-SNAPSHOT')
        author = 'RuneWraith'
        description = 'Collection of RuneLite Automation plugins built with the Kraken API.'
        github = 'Kraken-Plugins/kraken-example-plugin'
    }
}
