import java.util.concurrent.Callable

plugins {
    id 'com.krakenplugins.plugin' version '0.1.1'
}

def runeLiteVersion = '1.13.1' // latest.release
def krakenApiVersion = System.getenv("KRAKEN_API_VERSION") ?: '5.1.7'

subprojects {
    apply plugin: 'com.krakenplugins.plugin'

    group = 'com.krakenplugins'

    repositories {
        mavenLocal {
            content {
                includeGroup "com.github.kraken"
            }
        }
        maven {
            url = 'https://repo.runelite.net'
            content {
                excludeGroupByRegex "com\\.github.kraken.*"
            }
        }
        mavenCentral()
        maven {
            url = 'https://repo.kraken-plugins.com'
            content {
                includeGroup "com.github.kraken"
            }
        }
    }

    dependencies {
        compileOnly group: 'com.github.kraken', name: 'kraken-api', version: krakenApiVersion
        compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
        compileOnly 'org.projectlombok:lombok:1.18.30'
        annotationProcessor 'org.projectlombok:lombok:1.18.30'

        // The Run<Plugin>PluginTest classes run the plugin in plain RuneLite from the IDE.
        testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
        testImplementation group: 'com.github.kraken', name: 'kraken-api', version: krakenApiVersion
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(17)
    }
}

kraken {
    sideload.setFrom({ subprojects.collect { it.tasks.named('jar') } } as Callable)
}
