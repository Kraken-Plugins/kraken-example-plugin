name: Build and Release

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate version
        run: |
          # Read base version from file
          BASE_VERSION=$(cat version.txt | tr -d '[:space:]')
          
          # Extract major.minor from base version (e.g., "1.1" from "1.1.0")
          MAJOR_MINOR=$(echo $BASE_VERSION | cut -d. -f1,2)
          
          # FIX 1: Check for "v${BASE_VERSION}" instead of just "${BASE_VERSION}"
          if git rev-parse "refs/tags/v${BASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${BASE_VERSION} exists. Incrementing patch..."
            
            # FIX 2: Search for tags starting with "v", and sort by version properly
            LAST_TAG=$(git tag -l "v${MAJOR_MINOR}.*" --sort=-v:refname | head -n 1)
            
            # FIX 3: Strip the 'v' prefix before doing math
            # This converts "v1.0.0" -> "1.0.0"
            CLEAN_TAG=${LAST_TAG#v}
            
            LAST_PATCH=$(echo $CLEAN_TAG | awk -F. '{print $NF}')
            PATCH=$((LAST_PATCH + 1))
            VERSION="${MAJOR_MINOR}.${PATCH}"
          else
            # Base version doesn't exist yet, use it as-is
            echo "Tag v${BASE_VERSION} does not exist. Starting new release."
            VERSION="${BASE_VERSION}"
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Calculated version: $VERSION"

      # Builds and tests every plugin, checks each against the Kraken API the client runs, and writes the jars with a
      # manifest signed by KRAKEN_SIGNING_KEY to build/kraken-release. Clients pin this key the first time a user approves
      # the repository, so updates signed with it apply without a review; the task fails rather than publish unsigned.
      - name: Build, check and sign the release
        env:
          # Ed25519 private key PEM, from ./gradlew krakenKeygen or: openssl genpkey -algorithm ed25519
          KRAKEN_SIGNING_KEY: ${{ secrets.KRAKEN_SIGNING_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean build krakenRelease --stacktrace
          echo "FINGERPRINT=$(cat build/kraken/signing-key-fingerprint.txt)" >> "$GITHUB_ENV"

      - name: Create Git tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v$VERSION" -m "Release version $VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            Automated release of version ${{ env.VERSION }}
            
            ## Plugins included in this release:
            See manifest.json for full details. It is signed with key `${{ env.FINGERPRINT }}`; the Kraken client shows
            this fingerprint on its review screen when you add the repository.
          files: |
            build/kraken-release/*.jar
            build/kraken-release/manifest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}